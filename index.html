<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Артем — Разработка сайтов и Telegram Mini Apps</title>
<style>
  :root {
    --bg: #0A0A0C; --card: #141418; --border: #26262E;
    --text: #FFFFFF; --sub: #9A9AA6; --blue: #007AFF; --green: #30D158;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 60px; }
  a { text-decoration: none; color: inherit; }
  .container { max-width: 960px; margin: 0 auto; padding: 0 20px; }

  /* Header */
  header {
    position: sticky; top: 0; z-index: 100; background: rgba(10,10,12,0.85);
    backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 16px 0;
  }
  .nav-wrap { display: flex; justify-content: space-between; align-items: center; }
  .logo { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  .logo span { color: var(--blue); }
  .nav-links { display: flex; gap: 20px; font-size: 14px; color: var(--sub); }
  .nav-links a:hover { color: var(--text); }
  .btn-top { background: var(--blue); color: #fff; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; }

  /* Hero */
  .hero { padding: 72px 0 56px; text-align: center; }
  .pill {
    display: inline-block; background: rgba(0,122,255,0.12); color: var(--blue);
    border: 1px solid rgba(0,122,255,0.3); padding: 6px 14px; border-radius: 20px;
    font-size: 12px; font-weight: 600; margin-bottom: 20px;
  }
  h1 { font-size: clamp(32px, 5vw, 52px); font-weight: 800; letter-spacing: -1px; line-height: 1.15; margin-bottom: 18px; }
  .hero p { color: var(--sub); font-size: clamp(16px, 2vw, 19px); max-width: 640px; margin: 0 auto 32px; }
  .hero-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .btn-primary { background: var(--blue); color: #fff; padding: 14px 26px; border-radius: 14px; font-size: 15px; font-weight: 600; transition: 0.2s; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-sec { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 14px 26px; border-radius: 14px; font-size: 15px; font-weight: 600; }

    <section id="pricing">
    <div class="sec-title">Форматы работы и цены</div>
    <div class="sec-sub">Платите один раз — пользуетесь постоянно, без скрытых подписок</div>
    <div class="grid-3">
      <div class="card price-card">
        <div>
          <span class="tag">Для владельца</span>
          <h3>Telegram-касса</h3>
          <div class="price">$150 <span>/ под ключ</span></div>
          <ul class="feat-list">
            <li>Адаптация под ваш бренд и адрес</li>
            <li>Учет выручки, расходов и чистой прибыли</li>
            <li>Калькулятор маржи и учет долгов</li>
            <li>Передача прав на бота на ваш аккаунт</li>
          </ul>
        </div>
        <a href="https://t.me" class="btn-card">Заказать кассу</a>
      </div>

      <div class="card price-card featured">
        <div>
          <span class="tag" style="color:#fff; background:var(--blue);">Хит продаж</span>
          <h3>Сайт + Касса в TG</h3>
          <div class="price">$300 <span>/ комплект</span></div>
          <ul class="feat-list">
            <li>Продающий одностраничный сайт под ключ</li>
            <li>Закрытая финансовая касса в Telegram</li>
            <li>Прием заявок с сайта прямо в мессенджер</li>
            <li>Бесплатный хостинг и помощь с запуском</li>
          </ul>
        </div>
        <a href="https://t.me" class="btn-card">Заказать комплект</a>
      </div>

      <div class="card price-card">
        <div>
          <span class="tag" style="color:var(--blue); background:rgba(0,122,255,0.12);">Для трафика</span>
          <h3>Продающий сайт</h3>
          <div class="price">$200 <span>/ под ключ</span></div>
          <ul class="feat-list">
            <li>Уникальный дизайн под вашу нишу</li>
            <li>Идеальная работа на iPhone и Android</li>
            <li>Блок прайса, отзывов и портфолио</li>
            <li>Кнопки быстрой связи в Telegram / WhatsApp</li>
          </ul>
        </div>
        <a href="https://t.me" class="btn-card">Заказать сайт</a>
      </div>
    </div>
  </section>

  <section id="process">
    <div class="sec-title">Как проходит запуск</div>
    <div class="sec-sub">Без долгих брифов и предоплаты за воздух</div>
    <div class="grid-3">
      <div class="card">
        <h3>1. Демо-версия</h3>
        <p style="margin-bottom:0;">Собираю рабочий прототип под ваш бизнес, чтобы вы могли потыкать кнопки на своем телефоне до оплаты.</p>
      </div>
      <div class="card">
        <h3>2. Правки под вас</h3>
        <p style="margin-bottom:0;">Меняем цвета, тексты, валюту, категории или контакты, пока вас не устроит каждая деталь.</p>
      </div>
      <div class="card">
        <h3>3. Передача прав</h3>
        <p style="margin-bottom:0;">После оплаты передаю вам все права владельца на бота и сайт, помогаю с первым запуском.</p>
      </div>
    </div>
  </section>

  <footer>
    <div>© 2026 Artem.dev • Разработка сайтов и Telegram Mini Apps • Минск</div>
  </footer>
</div>

</body>
</html>
